<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F3A5F" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Finanzas personales y familiares, privadas y en tu dispositivo." />
    <title>Mis Finanzas</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <!-- Aplica el tema antes de pintar para evitar un destello blanco. -->
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('mis-finanzas-theme') || 'system'; } catch (e) {}
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta app necesita JavaScript. / This app requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
